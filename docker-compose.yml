services:
  influxdb:
    image: influxdb:2.9
    container_name: teltonika-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_HTTP_BIND_ADDRESS=:8086
      - INFLUXDB_INIT_MODE=setup
      - INFLUXDB_INIT_USERNAME=admin
      - INFLUXDB_INIT_PASSWORD=adminpass
      - INFLUXDB_INIT_ORG=my-org
      - INFLUXDB_INIT_BUCKET=teltonika
      - INFLUXDB_INIT_ADMIN_TOKEN=my-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:main-slim
    container_name: teltonika-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: teltonika-server
    ports:
      - "5000:5000"
    depends_on:
      - influxdb
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=teltonika

  tracker:
    build:
      context: .
      dockerfile: Dockerfile.tracker
    container_name: teltonika-tracker
    depends_on:
      - server
    environment:
      - SERVER_IP=server
      - SERVER_PORT=5000
      - IMEI=123456789012345
      - NUM_DEVICES=1
      - INTERVAL_8E=10
      - TIMEOUT_RESPONSE=2
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
